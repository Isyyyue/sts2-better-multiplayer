name: 缺陷报告 / Bug report
description: 报告一个可复现的问题 / Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。联机问题通常需要**双方版本一致**才能复现，请尽量填全下面几项。

        ⚠️ **不要**在这里粘贴房间密码、玩家昵称、Steam ID 或完整日志原文。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 描述实际看到的现象，以及你期望的结果。
      placeholder: |
        例：在篝火发起交易、双方都点了「锁定报价」之后，界面一直停在
        「等待双方锁定报价」，按钮变灰点不动，只能取消。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 越具体越好。说明是单人还是多人、发生在哪个房间（篝火 / 商店）。
      placeholder: |
        1. 房主创建房间，双方进入
        2. 走到篝火，两人都选「交易」
        3. A 邀请 B，B 接受
        4. A 选一张卡，点「锁定报价」
        5. 界面卡住
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod 版本 / Mod version
      description: 设置页或创意工坊页面上显示的版本号。
      placeholder: "0.6.5"
    validations:
      required: true

  - type: dropdown
    id: steam-branch
    attributes:
      label: 游戏分支 / Steam branch
      description: 在 Steam 里右键游戏 → 属性 → 测试版 查看。
      options:
        - public（正式版）
        - public-beta（先行版）
        - 不确定 / Not sure
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: 游戏版本 / Game version
      description: 主菜单角落显示的版本号。
      placeholder: "v0.107.1"
    validations:
      required: false

  - type: input
    id: baselib-version
    attributes:
      label: BaseLib 版本 / BaseLib version
      description: 创意工坊 BaseLib 页面上显示的版本。
      placeholder: "v3.4.5"
    validations:
      required: false

  - type: input
    id: players
    attributes:
      label: 参与人数 / Players in the run
      placeholder: "2"
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断反馈编号 / Diagnostic report ID
      description: |
        如果游戏还能进设置页，点一次「发送诊断反馈」，把弹窗里返回的报告编号填在这里。
        这比贴日志有效得多 —— 它是固定结构的，且不含隐私字段。
      placeholder: "例：BM-20260923-XXXX"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志片段 / Relevant log lines
      description: |
        只贴**与问题直接相关**的几行，不要贴整份日志。
        日志位于 `%APPDATA%\SlayTheSpire2\logs\godot.log`，
        带 `[BetterMultiplayer]` 前缀的行最有价值。
        贴之前请删掉房间名、密码、玩家 ID。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 所有参与者安装的是**相同版本**的 Mod 与 BaseLib
          required: true
        - label: 我确认没有在报告里包含密码、昵称或其他隐私信息
          required: true
        - label: 我已经搜索过现有 issue，确认这不是重复报告
          required: true
