name: 功能建议 / Feature request
description: 提出新功能或对现有行为的改进 / Suggest a new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先确认：本 Mod 的定位是**保留官方好友联机**并补充协作玩法，
        不会引入公开房间列表、房主迁移或第三方服务器。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      description: 先描述痛点，不要直接跳到方案。
      placeholder: |
        例：篝火交易一次只能和一个队友做，四人局里想一次和两个队友交换就很麻烦。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法 / Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 是否涉及联机同步 / Does it affect multiplayer synchronization
      description: |
        涉及状态同步的改动风险最高 —— 本 Mod 采用锁步模型，
        各端独立模拟，私自改状态会导致不同步甚至掉线。
      options:
        - 不涉及（纯界面或本地行为）
        - 涉及，但只是新增消息类型
        - 涉及，会改变现有同步状态
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索过现有 issue 与 README 的「已知限制」一节
          required: true
        - label: 我愿意自己实现并提交 PR（可选）
          required: false
